# HasiScan → Cloudflare Pages (`hasiscan`).
# Token: repo secret CLOUDFLARE_API_TOKEN (same as other Hasi sites).
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      NITRO_PRESET: cloudflare_pages
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve Pages output
        id: out
        run: |
          set -euo pipefail
          if [ -d .output/public ]; then
            echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          elif [ -d dist ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "Build output missing"
            ls -la
            exit 1
          fi

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repo secrets."
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          status=$(curl -sS -o /tmp/get.json -w "%{http_code}" \
            "${api}/hasiscan" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "GET status: ${status}"
          if [ "${status}" = "200" ]; then
            echo "Project hasiscan already exists."
          elif [ "${status}" = "404" ]; then
            echo "Creating project hasiscan..."
            curl -sS -o /tmp/create.json -w "POST status: %{http_code}\n" \
              -X POST "${api}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"hasiscan","production_branch":"main"}'
            cat /tmp/create.json
            python3 -c "import json,sys; d=json.load(open('/tmp/create.json')); sys.exit(0 if d.get('success') else 1)"
          else
            echo "Unexpected GET status ${status}:"
            cat /tmp/get.json
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ steps.out.outputs.dir }} --project-name=hasiscan --branch=main --commit-dirty=true
